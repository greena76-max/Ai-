<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HY STORE OFFICIAL</title>
    <style>
        :root {
            --bg-white: #FFFFFF;
            --bg-surface: #F8F9FA;
            --primary-red: #E50914;
            --primary-red-light: #FFF0F1;
            --dark-black: #0B0B0B;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --border-light: #E5E5E5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-surface);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        /* SVG Outline Line Helpers */
        .icon-svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            display: block;
        }

        .icon-sm {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .icon-lg {
            width: 44px;
            height: 44px;
            stroke: var(--dark-black);
            stroke-width: 1.3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Top Sticky Header */
        .app-header {
            background-color: var(--bg-white);
            padding: 12px 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-light);
        }

        .top-tabs {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .top-tabs::-webkit-scrollbar { display: none; }

        .brand-badge {
            font-weight: 900;
            font-size: 15px;
            color: var(--dark-black);
            letter-spacing: 0.4px;
            margin-right: 14px;
            white-space: nowrap;
        }
        .brand-badge span { color: var(--primary-red); }

        .tab-list {
            display: flex;
            gap: 16px;
        }

        .top-tab {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            padding-bottom: 4px;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
        }

        .top-tab.active {
            color: var(--primary-red);
            font-weight: 700;
        }

        .top-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background-color: var(--primary-red);
        }

        /* Search Bar */
        .search-container {
            display: flex;
            align-items: center;
            border: 1.5px solid var(--primary-red);
            border-radius: 24px;
            padding: 3px 4px 3px 8px;
            background-color: var(--bg-white);
        }

        .img-search-btn {
            background-color: var(--primary-red-light);
            color: var(--primary-red);
            border: 1px solid #FFD0D4;
            border-radius: 16px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 6px 8px;
            font-size: 13px;
            color: var(--text-main);
            min-width: 70px;
            background: transparent;
        }

        .mic-btn {
            background: none;
            border: none;
            padding: 0 8px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .search-submit-btn {
            background-color: var(--primary-red);
            color: var(--bg-white);
            border: none;
            border-radius: 20px;
            padding: 7px 15px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Quick Action Cards */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 12px 6px;
            background-color: var(--bg-white);
        }

        .action-card {
            background-color: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 10px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .action-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background-color: var(--primary-red-light);
            color: var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .action-text {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--dark-black);
        }

        /* Trust Banner */
        .trust-banner-wrap {
            background-color: var(--bg-white);
            padding: 6px 12px 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .trust-banner {
            background-color: var(--primary-red-light);
            border: 1px solid #FFD0D4;
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 48%;
            color: var(--dark-black);
        }

        .trust-item svg { color: var(--primary-red); }

        .trust-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--dark-black);
        }

        .trust-sub {
            font-size: 10px;
            color: var(--text-muted);
        }

        .trust-divider {
            width: 1px;
            height: 24px;
            background-color: #FFB3BA;
        }

        /* Filter Chips */
        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .chip {
            background-color: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 18px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background-color: var(--primary-red);
            color: var(--bg-white);
            border-color: var(--primary-red);
            font-weight: 600;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 12px;
        }

        .product-card {
            background-color: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .badge-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: var(--primary-red);
            color: var(--bg-white);
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
        }

        .product-img-box {
            width: 100%;
            height: 160px;
            background-color: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border-light);
        }

        .lens-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 26px;
            height: 26px;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-black);
        }

        .save-card-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
        }
        .save-card-btn.saved {
            color: var(--primary-red);
            border-color: var(--primary-red);
        }
        .save-card-btn.saved svg {
            fill: var(--primary-red);
        }

        .product-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.35;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--primary-red);
        }

        .moq-text {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .quick-add-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: var(--primary-red);
            color: var(--bg-white);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Bottom App Navigation Bar (Home, Catalog, Cart, Saved, Profile with Red Active Accent)[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-white);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            z-index: 150;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            width: 20%;
        }

        .nav-item.active {
            color: var(--primary-red);
            font-weight: 700;
        }

        .cart-badge {
            position: absolute;
            top: -3px;
            right: 18px;
            background-color: var(--primary-red);
            color: var(--bg-white);
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 10px;
            border: 1.5px solid var(--bg-white);
        }

        .gesture-bar {
            position: fixed;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 4px;
            background-color: #888888;
            border-radius: 4px;
            z-index: 160;
            pointer-events: none;
        }

        /* Cart Bottom Sheet */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 300;
            justify-content: flex-end;
            flex-direction: column;
        }

        .sheet-content {
            background: var(--bg-white);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 82vh;
            overflow-y: auto;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 12px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .checkout-cta {
            width: 100%;
            background-color: var(--primary-red);
            color: var(--bg-white);
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top App Header -->
    <header class="app-header">
        <div class="top-tabs">
            <div class="brand-badge">HY <span>STORE</span></div>
            <div class="tab-list">
                <div class="top-tab active" onclick="switchTopTab(this)">Products</div>
                <div class="top-tab" onclick="switchTopTab(this)">Custom Studio</div>
                <div class="top-tab" onclick="switchTopTab(this)">Bulk Orders</div>
                <div class="top-tab" onclick="switchTopTab(this)">New</div>
            </div>
        </div>

        <div class="search-container">
            <button class="img-search-btn" onclick="alert('Select a photo to preview on Mug or Frame')">
                <svg class="icon-sm" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                Photo
            </button>
            <input type="text" class="search-input" id="search-box" placeholder="Search mugs, frames..." onkeyup="searchProducts()">
            <button class="mic-btn" onclick="alert('Voice search active')">
                <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="search-submit-btn" onclick="searchProducts()">Search</button>
        </div>
    </header>

    <!-- Quick Actions -->
    <section class="quick-actions">
        <div class="action-card" onclick="filterItems('All')">
            <div class="action-icon">
                <svg class="icon-sm" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </div>
            <div class="action-text">Design<br>Your Mug</div>
        </div>
        <div class="action-card" onclick="alert('Request wholesale gift quote')">
            <div class="action-icon">
                <svg class="icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            </div>
            <div class="action-text">Request<br>Quote</div>
        </div>
        <div class="action-card" onclick="filterItems('Deals')">
            <div class="action-icon">
                <svg class="icon-sm" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            </div>
            <div class="action-text">Top<br>Ranking</div>
        </div>
    </section>

    <!-- Trust Banner -->
    <section class="trust-banner-wrap">
        <div class="trust-banner">
            <div class="trust-item">
                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                <div>
                    <div class="trust-title">FREE shipping</div>
                    <div class="trust-sub">on your first order</div>
                </div>
            </div>
            <div class="trust-divider"></div>
            <div class="trust-item">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                <div>
                    <div class="trust-title">Safe Printing</div>
                    <div class="trust-sub">Breakage replacement</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Filter Chips -->
    <section class="filter-bar">
        <div class="chip active" onclick="filterItems('All', this)">All</div>
        <div class="chip" onclick="filterItems('SALE', this)">SALE</div>
        <div class="chip" onclick="filterItems('Deals', this)">Top Deals</div>
        <div class="chip" onclick="filterItems('Mugs', this)">Magic Mugs</div>
        <div class="chip" onclick="filterItems('Frames', this)">LED Frames</div>
    </section>

    <!-- Product Grid -->
    <main class="product-grid" id="product-feed">
        <!-- Rendered by JavaScript -->
    </main>

    <!-- Bottom App Navigation Bar (Home, Catalog, Cart, Saved, Profile with Red Accent)[span_6](start_span)[span_6](end_span)[span_7](start_span)[span_7](end_span) -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="setActiveNav(this); filterItems('All'); window.scrollTo({top: 0, behavior: 'smooth'})">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/>
            </svg>
            <span>Home</span>
        </div>

        <div class="nav-item" onclick="setActiveNav(this); filterItems('Mugs')">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <circle cx="6.5" cy="6.5" r="3"/>
                <line x1="8.8" y1="8.8" x2="10.5" y2="10.5"/>
                <rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/>
                <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/>
                <rect x="14" y="14" width="6.5" height="6.5" rx="1.5"/>
            </svg>
            <span>Catalog</span>
        </div>

        <div class="nav-item" onclick="setActiveNav(this); openCart()">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <circle cx="9" cy="20" r="1.5"/>
                <circle cx="18" cy="20" r="1.5"/>
                <path d="M2 3h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h9.2a1.5 1.5 0 0 0 1.4-1.1L21 7H6"/>
            </svg>
            <span class="cart-badge" id="nav-cart-count">0</span>
            <span>Cart</span>
        </div>

        <div class="nav-item" onclick="setActiveNav(this); showSavedItems()">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span>Saved</span>
        </div>

        <div class="nav-item" onclick="setActiveNav(this); alert('Account & Order Tracking')">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-3.8 3.6-6.5 8-6.5s8 2.7 8 6.5"/>
            </svg>
            <span>Profile</span>
        </div>
    </nav>
    <div class="gesture-bar"></div>

    <!-- Cart Bottom Sheet -->
    <div class="modal-overlay" id="cart-modal" onclick="closeCartOutside(event)">
        <div class="sheet-content">
            <div class="sheet-header">
                <h3 style="font-size: 16px; font-weight: 700;">Shopping Cart (<span id="sheet-count">0</span>)</h3>
                <button onclick="closeCart()" style="background:none; border:none; font-size:22px; cursor:pointer; color:#111;">&times;</button>
            </div>
            <div id="cart-list">
                <p style="text-align:center; color:#777; padding:25px 0; font-size:13px;">Your cart is empty.</p>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:15px; font-weight:700; font-size:15px;">
                <span>Total Payable:</span>
                <span style="color:var(--primary-red);" id="cart-total-price">PKR 0</span>
            </div>
            <button class="checkout-cta" onclick="placeOrder()">Proceed to Order</button>
        </div>
    </div>

    <script>
        const svgIcons = {
            mug: `<svg class="icon-lg" viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>`,
            frame: `<svg class="icon-lg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            gift: `<svg class="icon-lg" viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7 z"/></svg>`,
            box: `<svg class="icon-lg" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`
        };

        const catalog = [
            { id: 1, title: "Heat Sensitive Magic Photo Mug (Black Matte)", price: 1150, moq: "1 piece", category: "Mugs", tag: "SALE", badge: "LIVE", sketch: "mug", saved: false },
            { id: 2, title: "Personalized Acrylic LED Couple Glow Frame", price: 2450, moq: "1 piece", category: "Frames", tag: "Deals", badge: "HOT", sketch: "frame", saved: false },
            { id: 3, title: "Sublimation White Ceramic Gift Mug + Box", price: 790, moq: "1 piece", category: "Mugs", tag: "SALE", badge: "-20%", sketch: "gift", saved: false },
            { id: 4, title: "Heart Handle Inner Red Custom Printed Mug", price: 1050, moq: "1 piece", category: "Mugs", tag: "Deals", badge: "", sketch: "mug", saved: false },
            { id: 5, title: "Wooden Rotating Photo Cube Lamp Frame", price: 3200, moq: "1 piece", category: "Frames", tag: "SALE", badge: "NEW", sketch: "frame", saved: false },
            { id: 6, title: "Wholesale Plain Sublimation Mugs (Box of 36)", price: 280, moq: "36 pieces", category: "Mugs", tag: "Deals", badge: "BULK", sketch: "box", saved: false }
        ];

        let cart = [];

        function renderFeed(items) {
            const feed = document.getElementById('product-feed');
            feed.innerHTML = '';

            if (items.length === 0) {
                feed.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#777; padding:40px 0; font-size:13px;">No items found.</p>';
                return;
            }

            items.forEach(item => {
                const badgeHTML = item.badge ? `<div class="badge-tag">${item.badge}</div>` : '';

                feed.innerHTML += `
                    <div class="product-card">
                        ${badgeHTML}
                        <button class="save-card-btn ${item.saved ? 'saved' : ''}" onclick="toggleSave(${item.id}, this)">
                            <svg class="icon-sm" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </button>
                        <div class="product-img-box">
                            ${svgIcons[item.sketch]}
                            <div class="lens-btn" title="Preview photo">
                                <svg class="icon-sm" style="width:13px;height:13px;" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
                            </div>
                        </div>
                        <div class="product-details">
                            <div class="product-title">${item.title}</div>
                            <div class="price-row">
                                <div>
                                    <div class="product-price">PKR ${item.price.toLocaleString()}</div>
                                    <div class="moq-text">MOQ: ${item.moq}</div>
                                </div>
                                <button class="quick-add-btn" onclick="addToCart(${item.id})">
                                    <svg class="icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function setActiveNav(el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function switchTopTab(el) {
            document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function filterItems(filter, el) {
            if (el) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            if (filter === 'All') {
                renderFeed(catalog);
            } else {
                const filtered = catalog.filter(p => p.category === filter || p.tag === filter);
                renderFeed(filtered);
            }
        }

        function toggleSave(id, btn) {
            const product = catalog.find(p => p.id === id);
            product.saved = !product.saved;
            btn.classList.toggle('saved');
        }

        function showSavedItems() {
            const saved = catalog.filter(p => p.saved);
            renderFeed(saved);
        }

        function searchProducts() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = catalog.filter(p => p.title.toLowerCase().includes(query));
            renderFeed(filtered);
        }

        function addToCart(id) {
            const product = catalog.find(p => p.id === id);
            cart.push(product);
            updateCart();
        }

        function updateCart() {
            document.getElementById('nav-cart-count').innerText = cart.length;
            document.getElementById('sheet-count').innerText = cart.length;

            const list = document.getElementById('cart-list');
            if (cart.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#777; padding:25px 0; font-size:13px;">Your cart is empty.</p>';
                document.getElementById('cart-total-price').innerText = 'PKR 0';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price;
                html += `
                    <div class="cart-row">
                        <div style="max-width:75%;">
                            <div style="font-size:13px; font-weight:600;">${item.title}</div>
                            <div style="font-size:12px; color:var(--primary-red); font-weight:700;">PKR ${item.price.toLocaleString()}</div>
                        </div>
                        <button onclick="removeItem(${idx})" style="background:none; border:none; color:#777; font-size:12px; font-weight:600; cursor:pointer;">Remove</button>
                    </div>
                `;
            });

            list.innerHTML = html;
            document.getElementById('cart-total-price').innerText = 'PKR ' + total.toLocaleString();
        }

        function removeItem(idx) {
            cart.splice(idx, 1);
            updateCart();
        }

        function openCart() {
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function closeCartOutside(e) {
            if (e.target.id === 'cart-modal') closeCart();
        }

        function placeOrder() {
            if (cart.length === 0) {
                alert("Please add items to your cart first.");
                return;
            }
            alert("Thank you! Your order on HY STORE OFFICIAL is confirmed.");
            cart = [];
            updateCart();
            closeCart();
        }

        // Initial Load
        renderFeed(catalog);
    </script>
</body>
</html>
